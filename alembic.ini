# Dev-only: lets `alembic revision --autogenerate -m "..."` find the migrations.
# The app runs migrations from code (migrations.upgrade), never from this file.
# The database comes from DATABASE_URL, else SQLITE_URL (see migrations/env.py).
[alembic]
script_location = coopstorage/storage/loc_load/data/migrations
file_template = %%(rev)s_%%(slug)s
